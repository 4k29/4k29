<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">4k29 — AI coding agent profile</title>
<desc id="desc">A Codex-inspired GitHub profile for 4k29 with a project sidebar, work log, composer, and a fictional usage-limit ending.</desc>

<style>
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Noto Sans CJK JP", Arial, sans-serif;
    font-size: 14px;
    fill: #24282c;
  }
  .muted { fill: #747c84; }
  .strong { font-weight: 600; }
  .mono {
    font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 14px;
  }
</style>

<defs>
  <clipPath id="frame">
    <rect x="0.5" y="0.5" width="899" height="649" rx="14"/>
  </clipPath>
</defs>

<g clip-path="url(#frame)">
  <rect width="900" height="650" fill="#ffffff"/>
  <rect x="0" y="0" width="190" height="650" fill="#f4f5f6"/>
  <rect x="190" y="0" width="710" height="48" fill="#fafafa"/>
  <path d="M190 0V650M0 48H900" stroke="#d9dde1" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="22" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="24" r="5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5" fill="#28c840"/>

  <!-- compact navigation controls -->
  <rect x="91" y="18" width="14" height="12" rx="2" fill="none" stroke="#747c84"/>
  <path d="M96 18V30M121 20L117 24L121 28M139 20L143 24L139 28" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sidebar -->
  <text x="16" y="72" class="strong">4k29</text>

  <path d="M18 94H30M24 88V100" stroke="#747c84" stroke-width="1.4" stroke-linecap="round"/>
  <text x="42" y="99">New chat</text>

  <circle cx="23" cy="126" r="6" fill="none" stroke="#747c84" stroke-width="1.4"/>
  <path d="M27 130L31 134" stroke="#747c84" stroke-width="1.4" stroke-linecap="round"/>
  <text x="42" y="131">Search</text>

  <rect x="17" y="150" width="6" height="6" rx="1" fill="none" stroke="#747c84"/>
  <rect x="26" y="150" width="6" height="6" rx="1" fill="none" stroke="#747c84"/>
  <rect x="17" y="159" width="6" height="6" rx="1" fill="none" stroke="#747c84"/>
  <rect x="26" y="159" width="6" height="6" rx="1" fill="none" stroke="#747c84"/>
  <text x="42" y="162">Plugins</text>

  <circle cx="23" cy="190" r="7" fill="none" stroke="#747c84" stroke-width="1.4"/>
  <path d="M23 186V190L27 192" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round"/>
  <text x="42" y="195">Automations</text>

  <text x="16" y="240" class="muted">Projects</text>
  <path d="M18 258V270H33V259H26L23 256H18V258Z" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="42" y="270">4k29</text>
  <path d="M168 263L171 266L174 263" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="10" y="282" width="170" height="34" rx="7" fill="#e9ecef"/>
  <text x="24" y="304" class="strong">GitHub profile</text>
  <circle cx="166" cy="299" r="3" fill="#747c84"/>

  <path d="M18 334V346H33V335H26L23 332H18V334Z" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="42" y="346">Tecirc</text>

  <text x="16" y="394" class="muted">Sessions</text>
  <text x="24" y="424">GitHub profile</text>
  <text x="24" y="454" class="muted">Tecirc notes</text>
  <text x="16" y="625" class="muted mono">vibe-coding</text>

  <!-- top bar -->
  <text x="212" y="30" class="strong">GitHub profile</text>
  <text x="326" y="30" class="muted">4k29</text>

  <rect x="694" y="10" width="72" height="28" rx="7" fill="#ffffff" stroke="#d9dde1"/>
  <text x="715" y="29">Open</text>
  <path d="M752 21L755 24L752 27" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="774" y="10" width="92" height="28" rx="7" fill="#ffffff" stroke="#d9dde1"/>
  <text x="792" y="29">Commit</text>
  <path d="M850 21L853 24L850 27" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- conversation -->
  <rect x="226" y="76" width="640" height="52" rx="11" fill="#f6f7f8"/>
  <text x="244" y="108">このGitHub、いい感じにしといて。</text>

  <circle cx="232" cy="163" r="3" fill="#747c84"/>
  <text x="244" y="168" class="strong">I’ll take a look.</text>

  <text x="226" y="205" class="muted">Explored</text>
  <path d="M287 198L290 201L293 198" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 219V292" stroke="#d9dde1" stroke-width="1.3"/>

  <path d="M245 224L248 227L254 220" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="229" class="muted">Read profile</text>

  <path d="M245 250L248 253L254 246" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="255" class="muted">Inspected repositories</text>

  <path d="M245 276L248 279L254 272" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="281" class="muted">Checked recent activity</text>

  <text x="226" y="328" class="strong">4k29</text>
  <text x="226" y="358">Student · Vibe coder · Building Tecirc</text>
  <text x="226" y="388">Most of the code here was written with ChatGPT.</text>
  <text x="226" y="418">The ideas, direction, complaints, and "なんか違</text>
  <rect x="557" y="405" width="1.5" height="17" fill="#747c84"/>

  <!-- limit -->
  <rect x="226" y="446" width="640" height="66" rx="11" fill="#f1f3f5" stroke="#d9dde1"/>
  <text x="244" y="473" class="strong">Usage limit reached</text>
  <text x="244" y="496" class="muted">Try again later.</text>

  <!-- composer -->
  <rect x="210" y="536" width="674" height="96" rx="14" fill="#f6f7f8" stroke="#d9dde1"/>
  <rect x="210" y="536" width="674" height="62" rx="14" fill="#ffffff" stroke="#d9dde1"/>
  <text x="228" y="570" class="muted">Ask anything…</text>
  <text x="812" y="570" class="muted" text-anchor="end">Limit reached</text>
  <circle cx="858" cy="567" r="10" fill="#e9ecef"/>
  <path d="M858 572V562M854 566L858 562L862 566" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="228" y="618" class="muted">Default permissions</text>
  <path d="M354 611L357 614L360 611" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M390 606V618H405V607H398L395 604H390V606Z" fill="none" stroke="#747c84" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="414" y="618" class="muted">4k29</text>

  <rect x="470" y="606" width="12" height="8" rx="1" fill="none" stroke="#747c84" stroke-width="1.2"/>
  <path d="M468 617H484" fill="none" stroke="#747c84" stroke-width="1.2" stroke-linecap="round"/>
  <text x="492" y="618" class="muted">Work locally</text>

  <path d="M610 605V617M610 611H620V605" fill="none" stroke="#747c84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="628" y="618" class="muted">main</text>
</g>

<rect x="0.5" y="0.5" width="899" height="649" rx="14" fill="none" stroke="#d9dde1"/>
</svg>