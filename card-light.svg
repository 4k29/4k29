<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Codex — 4k29</title>
<desc id="desc">A Codex desktop-style GitHub profile for 4k29 with a sidebar, chat history, full-access composer, and a fictional usage-limit ending.</desc>

<style>
text{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",Arial,sans-serif;
  font-size:14px;
  fill:#20201e;
  dominant-baseline:middle;
}
.muted{fill:#8a8a84}
.strong{font-weight:600}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
.access{fill:#9a5b08}
</style>

<defs>
  <clipPath id="window"><rect x=".5" y=".5" width="899" height="649" rx="14"/></clipPath>
</defs>

<g clip-path="url(#window)">
  <rect width="900" height="650" fill="#ffffff"/>
  <rect width="190" height="650" fill="#f5f5f3"/>
  <rect x="190" width="710" height="46" fill="#fbfbfa"/>
  <line x1="190" y1="0" x2="190" y2="650" stroke="#e2e2df"/>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#e2e2df"/>

  <!-- window controls -->
  <circle cx="21" cy="23" r="5" fill="#ff5f57"/>
  <circle cx="41" cy="23" r="5" fill="#febc2e"/>
  <circle cx="61" cy="23" r="5" fill="#28c840"/>

  <!-- sidebar utility controls -->
  <path d="M91 17h14v12H91zM96 17v12" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M122 19l-4 4 4 4M118 23h10" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M145 19l4 4-4 4M139 23h10" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- primary nav -->
  <path d="M18 69h12M24 63v12" fill="none" stroke="#8a8a84" stroke-width="1.35" stroke-linecap="round"/>
  <text x="42" y="69">New thread</text>

  <circle cx="23" cy="102" r="6" fill="none" stroke="#8a8a84" stroke-width="1.3"/>
  <path d="M27 106l4 4" fill="none" stroke="#8a8a84" stroke-width="1.3" stroke-linecap="round"/>
  <text x="42" y="102">Search</text>

  <path d="M18 129h5v5h-5zM27 129h5v5h-5zM18 138h5v5h-5zM27 138h5v5h-5z" fill="none" stroke="#8a8a84" stroke-width="1.15"/>
  <text x="42" y="136">Automations</text>

  <!-- projects -->
  <text x="16" y="180" class="muted">Projects</text>

  <path d="M17 198v10h14v-11h-7l-2-2h-5z" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="42" y="202" class="strong">4k29</text>
  <path d="M171 199l3 3 3-3" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="8" y="220" width="174" height="34" rx="7" fill="#e9e9e6"/>
  <circle cx="21" cy="237" r="3" fill="#3d7eff"/>
  <text x="34" y="237" class="strong">GitHub profile</text>

  <path d="M17 269v10h14v-11h-7l-2-2h-5z" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="42" y="273">Tecirc</text>

  <!-- chats -->
  <text x="16" y="314" class="muted">Chats</text>

  <text x="24" y="340">Fix profile layout</text>
  <text x="171" y="340" class="muted" text-anchor="end">now</text>

  <text x="24" y="370">Polish Tecirc spacing</text>
  <text x="171" y="370" class="muted" text-anchor="end">12m</text>

  <text x="24" y="400">Make OGP less boring</text>
  <text x="171" y="400" class="muted" text-anchor="end">38m</text>

  <text x="24" y="430">Clean up editor flow</text>
  <text x="171" y="430" class="muted" text-anchor="end">1h</text>

  <text x="24" y="460">Why is this broken</text>
  <text x="171" y="460" class="muted" text-anchor="end">2h</text>

  <text x="24" y="490">Remove unnecessary stuff</text>
  <text x="171" y="490" class="muted" text-anchor="end">4h</text>

  <text x="24" y="520">Ship without overengineering</text>
  <text x="171" y="520" class="muted" text-anchor="end">1d</text>

  <text x="24" y="550">Rewrite this properly</text>
  <text x="171" y="550" class="muted" text-anchor="end">2d</text>

  <!-- account footer -->
  <line x1="12" y1="590" x2="178" y2="590" stroke="#e2e2df"/>
  <circle cx="26" cy="615" r="10" fill="#e9e9e6"/>
  <text x="26" y="615" class="strong" text-anchor="middle">4</text>
  <text x="44" y="608" class="strong">4k29</text>
  <text x="44" y="629" class="muted">GPT-6 Astra</text>

  <!-- header -->
  <text x="212" y="23" class="strong">GitHub profile</text>
  <text x="318" y="23" class="muted">4k29</text>

  <rect x="724" y="9" width="70" height="28" rx="7" fill="#ffffff" stroke="#e2e2df"/>
  <text x="744" y="23">Open</text>
  <path d="M780 20l3 3-3 3" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="802" y="9" width="76" height="28" rx="7" fill="#ffffff" stroke="#e2e2df"/>
  <text x="819" y="23">Commit</text>
  <path d="M864 20l3 3-3 3" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- prompt -->
  <rect x="220" y="72" width="650" height="54" rx="12" fill="#f8f8f6"/>
  <text x="238" y="99">このGitHub、いい感じにしといて。</text>

  <!-- agent state -->
  <text x="220" y="160" class="muted">Working</text>
  <circle cx="274" cy="160" r="3" fill="#3d7eff"/>

  <text x="220" y="198" class="muted">Explored</text>
  <path d="M282 195l3 3 3-3" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="226" y1="215" x2="226" y2="286" stroke="#e2e2df" stroke-width="1.2"/>

  <path d="M239 222l3 3 6-7" fill="none" stroke="#339b5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="261" y="222" class="muted">Read profile</text>

  <path d="M239 248l3 3 6-7" fill="none" stroke="#339b5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="261" y="248" class="muted">Inspected repositories</text>

  <path d="M239 274l3 3 6-7" fill="none" stroke="#339b5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="261" y="274" class="muted">Inferred recent work</text>

  <!-- response -->
  <text x="220" y="322" class="strong">4k29</text>
  <text x="220" y="352">Student · Vibe coder · Building Tecirc</text>
  <text x="220" y="382">Most of the code here was written with ChatGPT.</text>
  <text x="220" y="412">The ideas, direction, complaints, and "なんか違</text>
  <rect x="551" y="403" width="1.5" height="18" fill="#8a8a84"/>

  <!-- usage limit -->
  <rect x="220" y="442" width="650" height="66" rx="10" fill="#f8f8f6" stroke="#e2e2df"/>
  <text x="238" y="466" class="strong">You've reached your usage limit</text>
  <text x="238" y="490" class="muted">Try again later.</text>

  <!-- composer -->
  <rect x="210" y="532" width="670" height="98" rx="15" fill="#ffffff" stroke="#e2e2df"/>
  <text x="230" y="558" class="muted">Ask Codex anything…</text>

  <path d="M232 579v12M226 585h12" fill="none" stroke="#8a8a84" stroke-width="1.3" stroke-linecap="round"/>

  <rect x="252" y="573" width="120" height="28" rx="7" fill="#f8f8f6" stroke="#e2e2df"/>
  <text x="264" y="587">GPT-6 Astra</text>
  <path d="M356 584l3 3 3-3" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="380" y="573" width="62" height="28" rx="7" fill="#f8f8f6" stroke="#e2e2df"/>
  <text x="396" y="587">Max</text>
  <path d="M427 584l3 3 3-3" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="450" y="573" width="116" height="28" rx="7" fill="#fff4e4" stroke="#efc27c"/>
  <circle cx="465" cy="587" r="3" fill="#d9951b"/>
  <text x="475" y="587" class="access">Full access</text>
  <path d="M550 584l3 3 3-3" fill="none" stroke="#9a5b08" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="851" cy="587" r="12" fill="#20201e"/>
  <path d="M851 593v-12M846 586l5-5 5 5" fill="none" stroke="#ffffff" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- context row -->
  <text x="230" y="618" class="muted">4k29</text>
  <text x="286" y="618" class="muted">main</text>
  <text x="337" y="618" class="muted">Desktop</text>
  <text x="406" y="618" class="access">Full access</text>
</g>

<rect x=".5" y=".5" width="899" height="649" rx="14" fill="none" stroke="#e2e2df"/>
</svg>