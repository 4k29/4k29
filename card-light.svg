<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">4k29 — AI coding agent profile</title>
<desc id="desc">A Codex-inspired but original GitHub profile for 4k29, with a project sidebar, agent work log, composer, and a fictional usage-limit ending.</desc>

<style>
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Noto Sans CJK JP", Arial, sans-serif;
    font-size: 14px;
    fill: #24282c;
  }
  .muted { fill: #747c84; }
  .strong { font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
</style>

<defs>
  <clipPath id="frame"><rect x=".5" y=".5" width="899" height="649" rx="14"/></clipPath>
</defs>

<g clip-path="url(#frame)">
  <rect width="900" height="650" fill="#ffffff"/>
  <rect x="0" y="0" width="196" height="650" fill="#f4f5f6"/>
  <rect x="196" y="0" width="704" height="48" fill="#fafafa"/>
  <path d="M196 0V650M0 48H900" stroke="#d9dde1" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="22" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="24" r="5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5" fill="#28c840"/>

  <!-- sidebar -->
  <text x="16" y="76" class="strong">4k29</text>

  <path d="M18 98H30M24 92V104" stroke="#747c84" stroke-width="1.4" stroke-linecap="round"/>
  <text x="42" y="103">New chat</text>

  <circle cx="23" cy="132" r="6" fill="none" stroke="#747c84" stroke-width="1.4"/>
  <path d="M27 136L31 140" stroke="#747c84" stroke-width="1.4" stroke-linecap="round"/>
  <text x="42" y="137">Search</text>

  <text x="16" y="190" class="muted">Projects</text>

  <path d="M18 208V220H33V209H26L23 206H18V208Z" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="42" y="220">4k29</text>
  <path d="M174 213L177 216L180 213" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="10" y="232" width="176" height="34" rx="7" fill="#e9ecef"/>
  <text x="24" y="254" class="strong">GitHub profile</text>
  <circle cx="172" cy="249" r="3" fill="#747c84"/>

  <path d="M18 284V296H33V285H26L23 282H18V284Z" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="42" y="296">Tecirc</text>

  <text x="16" y="348" class="muted">Sessions</text>
  <text x="24" y="380">Profile draft</text>
  <text x="24" y="410" class="muted">Tecirc editor</text>
  <text x="24" y="440" class="muted">Wishlist sync</text>
  <text x="24" y="470" class="muted">X algorithm analysis</text>
  <text x="24" y="500" class="muted">Apple news feed</text>
  <text x="24" y="530" class="muted">TwitterDB UI</text>

  <text x="16" y="590" class="muted">Account</text>
  <text x="16" y="612">4k29</text>
  <text x="16" y="638" class="muted">GPT-6 Astra</text>

  <!-- top bar -->
  <text x="218" y="30" class="strong">GitHub profile</text>
  <text x="332" y="30" class="muted">4k29</text>
  <text x="390" y="30" class="muted">GPT-6 Astra</text>

  <rect x="688" y="10" width="74" height="28" rx="7" fill="#ffffff" stroke="#d9dde1"/>
  <text x="711" y="29">Open</text>
  <path d="M748 21L751 24L748 27" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="770" y="10" width="96" height="28" rx="7" fill="#ffffff" stroke="#d9dde1"/>
  <text x="791" y="29">Commit</text>
  <path d="M850 21L853 24L850 27" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

