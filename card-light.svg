  <rect x="226" y="76" width="640" height="52" rx="11" fill="#f6f7f8"/>
  <text x="244" y="108">このGitHub、いい感じにしといて。</text>

  <!-- agent -->
  <circle cx="232" cy="163" r="3" fill="#747c84"/>
  <text x="244" y="168" class="strong">I’ll take a look.</text>

  <text x="226" y="205" class="muted">Explored</text>
  <path d="M287 198L290 201L293 198" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 219V292" stroke="#d9dde1" stroke-width="1.3"/>

  <path d="M245 224L248 227L254 220" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="229" class="muted">Read profile</text>

  <path d="M245 250L248 253L254 246" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="255" class="muted">Inspected repositories</text>

  <path d="M245 276L248 279L254 272" fill="none" stroke="#747c84" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="266" y="281" class="muted">Inferred recent work</text>

  <!-- result -->
  <text x="226" y="328" class="strong">4k29</text>
  <text x="226" y="358">Student · Vibe coder · Building Tecirc</text>
  <text x="226" y="388">Most of the code here was written with ChatGPT.</text>
  <text x="226" y="418">The ideas, direction, complaints, and "なんか違</text>
  <rect x="557" y="405" width="1.5" height="17" fill="#747c84"/>

  <!-- limit -->
  <rect x="226" y="446" width="640" height="66" rx="11" fill="#f8f9fa" stroke="#d9dde1"/>
  <text x="244" y="473" class="strong">You've reached your usage limit</text>
  <text x="244" y="496" class="muted">Try again later.</text>

  <!-- composer -->
  <rect x="210" y="536" width="674" height="96" rx="14" fill="#f1f3f5" stroke="#d9dde1"/>
  <rect x="210" y="536" width="674" height="62" rx="14" fill="#ffffff" stroke="#d9dde1"/>

  <text x="228" y="570" class="muted">Ask anything…</text>
  <text x="812" y="570" class="muted" text-anchor="end">Limit reached</text>
  <circle cx="858" cy="567" r="10" fill="#e9ecef"/>
  <path d="M858 572V562M854 566L858 562L862 566" fill="none" stroke="#747c84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="228" y="618" class="muted">4k29</text>

  <path d="M280 606V618H295V607H288L285 604H280V606Z" fill="none" stroke="#747c84" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="304" y="618" class="muted">GPT-6 Astra</text>

  <rect x="426" y="606" width="12" height="8" rx="1" fill="none" stroke="#747c84" stroke-width="1.2"/>
  <path d="M424 617H440" fill="none" stroke="#747c84" stroke-width="1.2" stroke-linecap="round"/>
  <text x="448" y="618" class="muted">Full access</text>

  <path d="M556 605V617M556 611H566V605" fill="none" stroke="#747c84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="574" y="618" class="muted">main</text>
</g>

<rect x=".5" y=".5" width="899" height="649" rx="14" fill="none" stroke="#d9dde1"/>
</svg>