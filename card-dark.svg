<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Codex — 4k29</title>
<desc id="desc">A close visual recreation of the Codex desktop interface, adapted as a GitHub profile for 4k29. It ends at a fictional usage limit.</desc>
<style>
