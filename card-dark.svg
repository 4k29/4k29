<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">4k29 — agent session</title>
<desc id="desc">A minimal AI coding-agent inspired GitHub profile for 4k29. The profile generation stops at a fictional usage limit.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP',sans-serif;font-size:14px;fill:#e7e9ea}
.muted{fill:#8b949e}
.medium{font-weight:600}
.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.cursor{animation:blink 1.3s step-end infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.cursor,.pulse{animation:none}}
</style>

<rect x=".5" y=".5" width="899" height="559" rx="16" fill="#111315" stroke="#2a2f34"/>
<path d="M1 48H899" stroke="#2a2f34"/>
<rect x="1" y="1" width="898" height="47" rx="15" fill="#15181b"/>
<rect x="1" y="33" width="898" height="15" fill="#15181b"/>

<circle cx="22" cy="24" r="5" fill="#ff5f57"/>
<circle cx="42" cy="24" r="5" fill="#febc2e"/>
<circle cx="62" cy="24" r="5" fill="#28c840"/>
<text x="450" y="29" text-anchor="middle" class="muted">4k29 — agent session</text>

<rect x="34" y="76" width="832" height="54" rx="12" fill="#1a1d20"/>
