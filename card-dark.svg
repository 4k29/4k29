<path d="M40 188V252" stroke="#2a2f34" stroke-width="1.5"/>
<path d="m52 193 3 3 6-7" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="198" class="muted mono">Read profile</text>
<path d="m52 219 3 3 6-7" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="224" class="muted mono">Inspected repositories</text>
<path d="m52 245 3 3 6-7" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="250" class="muted mono">Checked recent activity</text>

<text x="34" y="292" class="medium">4k29</text>
<text x="34" y="320" >Student · Vibe coder · Building Tecirc</text>
<text x="34" y="348" >Most of the code here was written with ChatGPT.</text>
