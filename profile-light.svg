<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">4k29 — agent session</title><desc id="desc">A Codex CLI-inspired GitHub profile. 4k29 is a student building Tecirc with ChatGPT. The response is interrupted by a fictional usage limit.</desc><style>text{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",monospace;font-size:18px;fill:#24242b}.blink{animation:blink 1.2s step-end infinite}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}</style><defs><clipPath id="window"><rect x=".5" y=".5" width="899" height="639" rx="14"/></clipPath></defs><g clip-path="url(#window)"><rect width="900" height="640" fill="#fafafb"/><rect width="900" height="52" fill="#f3f3f5"/><path d="M0 52H900" stroke="#c9c9d0"/><circle cx="26" cy="26" r="5.5" fill="#ff605b"/><circle cx="46" cy="26" r="5.5" fill="#ffbd44"/><circle cx="66" cy="26" r="5.5" fill="#00c94f"/><text x="450" y="33" style="fill:#676772" text-anchor="middle">4k29 — session</text><rect x="42" y="72" width="816" height="106" rx="8" fill="#fafafb" stroke="#c9c9d0"/><text x="62" y="105" font-weight="600" >&gt;_  profile / 4k29</text><text x="62" y="137" style="fill:#676772" >directory: github.com/4k29</text><text x="62" y="163" style="fill:#676772" >mode:      human in the loop</text><rect x="42" y="198" width="816" height="52" rx="0" fill="#e9e9ee"/><text x="62" y="231" >&gt; make this GitHub profile feel like me</text><text x="42" y="290" style="fill:#676772" >•  Read profile</text><text x="42" y="322" style="fill:#676772" >•  Inspected repositories</text><text x="42" y="354" style="fill:#226d88" >•  Found a recurring pattern</text><path d="M42 379H858" stroke="#c9c9d0"/><text x="42" y="417" >4k29 — student, vibe coder.</text><text x="42" y="449" >Building Tecirc: notes on technology and experience.</text><text x="42" y="481" >Most of the code here was written with ChatGPT.</text><text x="42" y="513" >My part: ideas, direction, and &quot;なんか違<tspan class="blink" style="fill:#24242b">▏</tspan></text><rect x="42" y="535" width="816" height="44" rx="4" fill="#e9e9ee"/><text x="62" y="564" style="fill:#676772" >Usage limit reached. Try again later.</text><rect x="42" y="593" width="816" height="38" rx="0" fill="#e9e9ee"/><text x="62" y="620" style="fill:#85858e" >&gt; Ask anything...</text><text x="838" y="620" style="fill:#676772" text-anchor="end">0% remaining</text></g><rect x=".5" y=".5" width="899" height="639" rx="14" fill="none" stroke="#c9c9d0"/></svg>