<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">4k29 profile</title>
<desc id="desc">Student and vibe coder building Tecirc. A minimal visual profile about ideas, AI-assisted development, projects, and iteration.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
  .bg{fill:#f7f7f5}.panel{fill:#ffffff;stroke:#deded9}.line{stroke:#e3e3de}
  .text{fill:#20201e}.muted{fill:#7f7f79}.green{fill:#339b5c}.greenStroke{stroke:#339b5c}
  .label{font-size:12px;font-weight:600;letter-spacing:1.6px}.small{font-size:14px}.body{font-size:15px}
  .title{font-size:54px;font-weight:650;letter-spacing:-2.5px}.project{font-size:18px;font-weight:600}
</style>
<rect class="bg" width="900" height="600"/>
<rect class="panel" x="22" y="22" width="856" height="556" rx="22"/>

<!-- identity mark -->
<g transform="translate(72 76)">
  <circle cx="76" cy="76" r="63" fill="none" stroke="#ddddD7" stroke-width="1.5"/>
  <circle cx="76" cy="76" r="44" fill="none" stroke="#e9e9e5" stroke-width="1"/>
  <path d="M76 13 A63 63 0 0 1 130 44" fill="none" class="greenStroke" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="13" x2="76" y2="0" class="greenStroke" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="76" r="4.5" class="green"/>
  <text x="76" y="82" text-anchor="middle" class="text body" font-weight="600">4k29</text>
</g>

<text x="250" y="74" class="muted label">PROFILE / 4K29</text>
<text x="250" y="139" class="text title">4k29</text>
<text x="250" y="172" class="text body">Student · Vibe coder · Building Tecirc</text>
<text x="250" y="202" class="muted small">Technology, design, experience, and the intent behind them.</text>

<line x1="250" y1="232" x2="828" y2="232" class="line"/>

<!-- now -->
<text x="250" y="270" class="muted label">NOW</text>
<circle cx="322" cy="266" r="4" class="green"/>
<text x="338" y="271" class="text project">Tecirc</text>
<text x="338" y="296" class="muted small">A place to think about gadgets, services, and information technology.</text>

<!-- method -->
<text x="250" y="342" class="muted label">METHOD</text>
<g class="small">
  <text x="338" y="344" class="text">idea</text>
  <text x="377" y="344" class="muted">→</text>
  <text x="401" y="344" class="text">prompt</text>
  <text x="458" y="344" class="muted">→</text>
  <text x="482" y="344" class="text">prototype</text>
  <text x="555" y="344" class="muted">→</text>
  <text x="579" y="344" class="text">“なんか違う”</text>
  <text x="675" y="344" class="muted">→</text>
  <text x="699" y="344" class="text">repeat</text>
</g>

<!-- projects -->
<text x="250" y="398" class="muted label">PROJECTS</text>
<text x="338" y="402" class="text project">Tecirc</text>
<text x="460" y="402" class="muted small">notes / design / technology</text>

<text x="338" y="443" class="text project">4k29</text>
<text x="460" y="443" class="muted small">this profile / experiments / small builds</text>

<!-- AI line -->
<line x1="250" y1="472" x2="828" y2="472" class="line"/>
<text x="250" y="508" class="muted label">AI</text>
<text x="338" y="507" class="text small">Most of the code here was written with ChatGPT.</text>
<text x="338" y="532" class="muted small">The ideas, direction, complaints, and “なんか違う” are mine.</text>

<!-- usage -->
<text x="72" y="280" class="muted label">USAGE</text>
<text x="72" y="318" class="text body" font-weight="600">0% remaining</text>
<rect x="72" y="336" width="132" height="5" rx="2.5" fill="#e5e5e0"/>
<text x="72" y="370" class="muted small">session exhausted</text>
<text x="72" y="394" class="muted small">try again later</text>

<!-- footer -->
<text x="72" y="540" class="muted small">main</text>
<circle cx="117" cy="536" r="3.5" class="green"/>
<text x="132" y="540" class="muted small">AI-assisted</text>
<text x="828" y="540" text-anchor="end" class="muted small">github.com/4k29</text>
</svg>