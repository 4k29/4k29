<circle cx="24" cy="25" r="5.5" fill="#ff605b"/><circle cx="44" cy="25" r="5.5" fill="#ffbd44"/><circle cx="64" cy="25" r="5.5" fill="#00c94f"/><text x="16" y="80" font-size="18" font-weight="650" >4k29</text><text x="16" y="119" font-size="11" font-weight="600" style="fill:#929492" letter-spacing="1.2">WORKSPACE</text><rect x="9" y="136" width="172" height="38" rx="8" fill="#292b2e"/><circle cx="27" cy="155" r="5" fill="#83c99b"/><text x="43" y="161" font-size="15" font-weight="600" >Profile</text><text x="43" y="203" font-size="15" style="fill:#c5c6c4" >Tecirc</text><text x="43" y="236" font-size="15" style="fill:#c5c6c4" >Ideas</text><path d="M16 265H174" stroke="#333538"/><text x="16" y="295" font-size="11" font-weight="600" style="fill:#929492" letter-spacing="1.2">CURRENT TASK</text><text x="16" y="326" font-size="14" style="fill:#c5c6c4" >A better profile</text><text x="16" y="455" font-size="11" font-weight="600" style="fill:#929492" letter-spacing="1.1">USAGE REMAINING</text><text x="16" y="487" font-size="18" font-weight="650" style="fill:#f3f3f2" >0%</text><rect x="61" y="472" width="112" height="7" rx="3.5" fill="#292b2e"/><circle cx="27" cy="520" r="12" fill="#264032"/><text x="27" y="525" font-size="13" font-weight="650" style="fill:#83c99b" text-anchor="middle">4</text><text x="49" y="525" font-size="14" style="fill:#c5c6c4" >4k29</text><text x="224" y="35" font-size="13" style="fill:#929492" >Profile</text><text x="278" y="35" font-size="13" style="fill:#929492" >/</text><text x="296" y="35" font-size="13" style="fill:#c5c6c4" class="mono">4K-29</text><path d="M190 56H900" stroke="#333538"/><circle cx="235" cy="92" r="5" fill="#83c99b"/><text x="249" y="98" font-size="12" font-weight="650" style="fill:#83c99b" letter-spacing=".8">IN PROGRESS</text><text x="224" y="145" font-size="30" font-weight="620" style="fill:#f3f3f2" letter-spacing="-.7">Make things feel right.</text><text x="224" y="180" font-size="16" style="fill:#c5c6c4" >Student · vibe coder · building Tecirc</text><text x="224" y="226" font-size="16" >I think about technology through its design, the way it feels to use,</text><text x="224" y="251" font-size="16" >and the ideas behind it. Then I try making things myself.</text><path d="M224 278H860" stroke="#333538"/><text x="224" y="310" font-size="11" font-weight="600" style="fill:#929492" letter-spacing="1.2">CURRENT PROJECT</text><text x="224" y="345" font-size="19" font-weight="600" style="fill:#f3f3f2" >Tecirc</text><text x="224" y="370" font-size="15" style="fill:#c5c6c4" >Notes on technology, interfaces, and experience.</text><path d="M224 395H860" stroke="#333538"/><text x="224" y="426" font-size="11" font-weight="600" style="fill:#929492" letter-spacing="1.2">ACTIVITY</text><circle cx="231" cy="451" r="3" fill="#83c99b"/><text x="248" y="456" font-size="14" style="fill:#c5c6c4" >Idea → ChatGPT → prototype → &quot;なんか違う&quot; → repeat</text><rect x="224" y="474" width="636" height="44" rx="9" fill="#292b2e"/><circle cx="244" cy="496" r="3.5" fill="#929492"/><text x="259" y="502" font-size="14" style="fill:#c5c6c4" >Paused — usage limit reached. Try again later.</text></g><rect x=".5" y=".5" width="899" height="539" rx="15" fill="none" stroke="#333538"/></svg>