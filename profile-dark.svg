<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">4k29 — profile session</title><desc id="desc">A Tecirc-inspired agent session. 4k29 is a student building Tecirc with ChatGPT. The response pauses at a fictional usage limit.</desc><style>text{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",monospace;font-size:15px;fill:#f5f5f7}.blink{animation:blink 1.2s step-end infinite}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}</style><defs><clipPath id="win"><rect x=".5" y=".5" width="899" height="589" rx="12"/></clipPath></defs><g clip-path="url(#win)"><rect width="900" height="590" fill="#0a0a0a"/><circle cx="25" cy="25" r="5.2" fill="#ff605b"/><circle cx="45" cy="25" r="5.2" fill="#ffbd44"/><circle cx="65" cy="25" r="5.2" fill="#00c94f"/><text x="450" y="31" style="fill:#7f7f84" text-anchor="middle">4k29 / session</text><path d="M44 52H856" stroke="#242424"/><text x="44" y="95" style="fill:#7f7f84" >WORKSPACE</text><text x="198" y="95" >github.com/4k29</text><text x="44" y="124" style="fill:#7f7f84" >PROJECT</text><text x="198" y="124" style="fill:#c7c7c8" >Tecirc — technology, design, experience.</text><path d="M44 151H856" stroke="#242424"/><text x="44" y="193" >&gt; make this GitHub profile feel like me</text><text x="44" y="249" style="fill:#7f7f84" >• Read profile</text><text x="44" y="277" style="fill:#7f7f84" >• Inspect repositories</text><text x="44" y="305" style="fill:#7f7f84" >• Find a recurring pattern</text><path d="M44 331H856" stroke="#242424"/><text x="44" y="370" >4k29 — student, vibe coder.</text><text x="44" y="400" >I build Tecirc to think about technology and how it feels.</text><text x="44" y="430" >Most of the code here was written with ChatGPT.</text><text x="44" y="460" >My part: ideas, direction, and &quot;なんか違<tspan class="blink" style="fill:#f5f5f7">▏</tspan></text><path d="M44 485H856" stroke="#242424"/><text x="44" y="523" style="fill:#c7c7c8" >Usage limit reached. Try again later.</text><path d="M44 545H856" stroke="#242424"/><text x="44" y="573" style="fill:#7f7f84" >&gt; Ask anything...</text><text x="856" y="573" style="fill:#7f7f84" text-anchor="end">0% remaining</text></g><rect x=".5" y=".5" width="899" height="589" rx="12" fill="none" stroke="#242424"/></svg>