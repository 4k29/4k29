name: Stop redundant static checkouts for response study
on:
  push:
    branches: [research/response-pilot-control]
    paths: [.github/workflows/response-pilot-control.yml]
permissions:
  actions: write
jobs:
  cancel-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only four verified redundant static-profile runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,os
          base="https://api.github.com/repos/4k29/4k29/actions/runs/"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          for rid in [42969597168,42969504764,42969506594,42969504810]:
              r=json.load(urllib.request.urlopen(urllib.request.Request(base+str(rid),headers=headers)))
              assert r["head_branch"]=="research/response-learning-pilot" and r["name"]=="Check static profile"
              if r["status"]=="completed":print(rid,"already completed",r["conclusion"]);continue
              req=urllib.request.Request(base+str(rid)+"/cancel",headers=headers,method="POST")
              with urllib.request.urlopen(req) as response:print(rid,"cancel request",response.status)
          print("No checkout; no model; optimizer calls0; dedicated pilot/DEV CI not targeted")
          PY
