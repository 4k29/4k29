name: Token intervention evidence
on:
  push:
    branches: [research/token-intervention]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/model.py
            /training/language/conversation-v2/foundation-data/research/zero_update_preflight.py
            /training/language/conversation-v2/core.py
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/gv-collapse-diagnostic/
            /training/language/conversation-v2/gv-prose-pilot/
            /training/language/conversation-v2/mixed-retention-study/artifacts/MIX-579/
            /training/language/conversation-v2/token-intervention/
      - run: python3 training/language/conversation-v2/token-intervention/verify.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python training/language/conversation-v2/token-intervention/replay.py
