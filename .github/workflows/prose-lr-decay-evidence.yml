name: Prose LR decay evidence
on:
  push:
    branches: [research/prose-lr-decay]
    paths: [training/language/conversation-v2/prose-lr-decay/REPORT.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/prose-learning-rate/*.json
            /training/language/conversation-v2/prose-learning-rate/*.json.gz
            /training/language/conversation-v2/prose-learning-rate/run.py
            /training/language/conversation-v2/prose-learning-rate/artifacts/*/checkpoint.json
            /training/language/conversation-v2/broad-prose-replay/TRAIN.json
            /training/language/conversation-v2/broad-prose-replay/NEW_DEV.json
            /training/language/conversation-v2/prose-lr-decay/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - working-directory: training/language/conversation-v2/prose-lr-decay
        run: |
          python verify.py
          python measure.py
          git diff --exit-code -- METRICS.json JUDGMENTS.json TABLES.md CALLS.json
