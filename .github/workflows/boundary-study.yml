name: Natural paragraph boundary evidence
on:
  pull_request:
    paths:
      - 'training/language/conversation-v2/boundary-study/**'
      - '.github/workflows/boundary-study.yml'
permissions:
  contents: read
jobs:
  boundary-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            GOAL.md
            .github/workflows/boundary-study.yml
            training/language/conversation-v2/boundary-study
            training/language/conversation-v2/foundation-stage/runtime.py
            training/language/conversation-v2/foundation-stage/mixed_runtime.py
            training/language/conversation-v2/foundation-stage/prose_decode.py
            training/language/conversation-v2/foundation-stage/prepare.py
            training/language/conversation-v2/foundation-stage/TOKEN_BOUNDARY_PROTOCOL.json
            training/language/conversation-v2/foundation-stage/data.jsonl.gz
            training/language/conversation-v2/foundation-stage/schedule.json.gz
            training/language/conversation-v2/foundation-stage/prose-dev.json
            training/language/conversation-v2/foundation-stage/evaluation/initial.json
            training/language/conversation-v2/foundation-stage/evaluation/initial-token-boundary.json
            training/language/conversation-v2/core.py
            training/language/conversation-v2/new_tokenizer.py
            training/language/conversation-v2/eval_core.py
            training/language/conversation-v2/PLAN.json
            training/language/conversation-v2/data/tokenizer.json
            training/language/conversation-v2/data/data.json
            training/language/conversation-v2/data/train.tokens.bin
            training/language/conversation-v2/data/dev.tokens.bin
            training/language/conversation-v2/epoch1/medium/archive/checkpoint.pt.chunks.json
            training/language/conversation-v2/epoch1/content-dev.json
            training/language/conversation-v2/response-data/final/active-dev.json
            training/language/conversation-v2/foundation-data/evaluation/human-dev.json
            training/language/conversation-v2/foundation-data/DATA-LICENSE.md
            training/language/conversation-v2/foundation-data/catalog.json
            training/language/conversation-v2/foundation-data/corpus/documents.jsonl.gz
            training/language/conversation-v2/foundation-data/research/zero_update_preflight.py
            training/language/conversation-v2/grounded-objective/PLAN.json
            training/language/conversation-v2/grounded-objective/data.json
            training/language/conversation-v2/grounded-objective/CONTEXT_PROBE_PLAN.json
            training/language/conversation-v2/grounded-objective/evaluation/initial3470.json
            training/language/conversation-v2/parity.py
            training/language/conversation-v2/parity.mjs
            training/language/model.py
            training/language/round10/word_bpe.py
            training/dialogue/tokenizer.py
            training/dialogue/inference.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python training/language/conversation-v2/boundary-study/verify.py
      - run: python -m unittest discover -s training/language/conversation-v2/boundary-study -p test_evidence.py -v
