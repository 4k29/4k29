name: GV prose limited learning and full-state verification
on:
  push:
    branches: [research/gv-prose-pilot]
    paths: [training/language/conversation-v2/gv-prose-pilot/RUN_GO]
permissions:
  contents: write
jobs:
  pilot-cpu:
    if: github.repository == '4k29/4k29' && !github.event.repository.private && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/conversation-v2/gv-prose-pilot/
            /training/language/conversation-v2/staged-prose-study/ADDITIONAL_PROSE.jsonl.gz
            /training/language/conversation-v2/staged-prose-study/GV_INTRO_READING.json
            /training/language/conversation-v2/novel-continuous-study/REVIEWED_PROSE.jsonl.gz
            /training/language/conversation-v2/foundation-absorption-study/corpus.jsonl.gz
            /training/language/conversation-v2/foundation-absorption-study/SCHEDULE.json
            /training/language/conversation-v2/mixed-retention-study/artifacts/MIX-579/
            /training/language/conversation-v2/mixed-retention-study/evaluation/terminal-MIX.json
            /training/language/conversation-v2/modern-corpus/next_runtime.py
            /training/language/conversation-v2/diverse-foundation/common.py
            /training/language/conversation-v2/foundation-stage/runtime.py
            /training/language/conversation-v2/foundation-stage/prose_decode.py
            /training/language/conversation-v2/foundation-data/research/zero_update_preflight.py
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/PLAN.json
            /training/language/conversation-v2/new_tokenizer.py
            /training/language/conversation-v2/core.py
            /training/language/conversation-v2/eval_core.py
            /training/dialogue/tokenizer.py
            /training/language/round10/word_bpe.py
            /training/language/model.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed data, teachers and protocol
        run: python training/language/conversation-v2/gv-prose-pilot/verify_data.py
      - name: CPU numerical libraries only
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5
      - name: Independent shared-state B and C pilots, checkpoints, cold restore, greedy
        run: python training/language/conversation-v2/gv-prose-pilot/engine.py
