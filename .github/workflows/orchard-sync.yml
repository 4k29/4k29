name: Sync Orchard feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orchard-sync.yml"
      - "orchard/package.json"
      - "orchard/package-lock.json"
      - "orchard/scripts/**"
      - "orchard/tests/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: orchard-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchard/package-lock.json

      - run: npm ci
        working-directory: orchard
      - run: npm test
        working-directory: orchard

      - name: Fetch, translate, and notify
        run: npm run sync
        working-directory: orchard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save updated feed
        run: |
          if git diff --quiet -- orchard/data/articles.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchard/data/articles.json
          git commit -m "Update Orchard feed"
          git push
