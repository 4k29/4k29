name: Broad prose replay evidence
on:
  push:
    branches: [research/broad-prose-replay]
    paths: [training/language/conversation-v2/broad-prose-replay/REPORT.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/family-diversity/C-0.json.gz
            /training/language/conversation-v2/family-diversity/JUDGMENTS.json
            /training/language/conversation-v2/replay-study/*.json
            /training/language/conversation-v2/replay-study/C-*.json.gz
            /training/language/conversation-v2/broad-prose-replay/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - working-directory: training/language/conversation-v2/broad-prose-replay
        run: |
          python verify.py
          python summarize.py
          git diff --exit-code -- DATA_AUDIT.json METRICS.json JUDGMENTS.json TABLES.md
