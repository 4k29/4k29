name: Japanese decoder depth evidence
on:
  push:
    branches: [research/prose-depth]
    paths:
      - .github/workflows/prose-depth-evidence.yml
      - training/language/conversation-v2/prose-depth/REPORT.md
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/model.py
            /training/language/conversation-v2/eval_core.py
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/prose-depth/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - working-directory: training/language/conversation-v2/prose-depth
        run: |
          python verify.py
          python summarize.py
          git diff --exit-code
