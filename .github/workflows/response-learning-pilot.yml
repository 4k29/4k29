name: Real model response CE pilot
on:
  push:
    branches: [research/response-learning-pilot]
    paths: [training/language/conversation-v2/response-learning-study/GO.json]
permissions:
  contents: write
jobs:
  pilot:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      STUDY: training/language/conversation-v2/response-learning-study
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - name: Guard and preserve zero-model launch receipt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test ! -f "$STUDY/UPDATES.jsonl"
          python - <<'PY'
          import pathlib,os,json,subprocess
          p=pathlib.Path(os.environ["STUDY"]);go=json.loads((p/"GO.json").read_text());assert subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()==go["expected_code_commit"]
          (p/"RUN_LAUNCH.json").write_text(json.dumps(dict(run_id=os.environ["GITHUB_RUN_ID"],input_commit=os.environ["GITHUB_SHA"],optimizer_calls_before_launch=0),indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STUDY/RUN_LAUNCH.json"
          git commit -m "Record isolated real-model CE pilot launch [skip ci]"
          git push origin HEAD:research/response-learning-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical libraries only
        run: |
          python -m pip install --no-cache-dir torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir numpy==2.3.5
      - name: Verify original turn and prior rights-reviewed input mapping
        run: python -B "$STUDY/verify_inputs.py"
      - name: Run isolated real Transformer preflight, pilot, cold restore and fixed greedy
        run: python -B "$STUDY/engine.py"
