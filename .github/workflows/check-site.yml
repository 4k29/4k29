name: Check static profile
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: |
          node --check docs/app.js
          node --check docs/boot.js
          node --check docs/dialogue.js
          node --check docs/question-analysis.js
          node --check docs/intent-model.js
          node --check docs/answer-view.js
          node --check docs/device-info.js
          node --check docs/answer-composition.js
          node --check docs/answer-entities.js
          node --check docs/intent-examples.js
          node --check docs/intent-retrieval.js
          node --check docs/japanese-reading.js
          node --check docs/question-journal.js
          node --check docs/unknown-subjects.js
          node --check docs/ui-text.js
          node --check docs/local-learning.js
          node --check docs/answer-priority.js
