name: Foundation absorption actual study
on:
  push:
    branches: [research/foundation-absorption-study]
    paths: [training/language/conversation-v2/foundation-absorption-study/GO.json]
permissions:
  contents: write
jobs:
  study:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STUDY: training/language/conversation-v2/foundation-absorption-study
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/conversation-v2/foundation-absorption-study/
            /training/language/conversation-v2/faq-ce-verified-study/DATA.json
            /training/language/conversation-v2/faq-ce-verified-study/DEV_PROTOCOL.json
            /training/language/conversation-v2/faq-ce-verified-study/GROUNDED_DEV.json
            /training/language/conversation-v2/faq-ce-verified-study/evaluation/initial.json
            /training/language/conversation-v2/faq-ce-verified-study/evaluation/A-study93.json
            /training/language/conversation-v2/core.py
            /training/language/conversation-v2/PLAN.json
            /training/language/conversation-v2/new_tokenizer.py
            /training/language/conversation-v2/eval_core.py
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/foundation-stage/runtime.py
            /training/language/conversation-v2/foundation-stage/prose_decode.py
            /training/language/conversation-v2/modern-corpus/next_runtime.py
            /training/language/conversation-v2/diverse-foundation/common.py
            /training/language/conversation-v2/foundation-data/research/zero_update_preflight.py
            /training/language/conversation-v2/mixed-retention-study/artifacts/MIX-579/
            /training/language/conversation-v2/mixed-retention-study/evaluation/terminal-MIX.json
            /training/language/conversation-v2/mixed-retention-study/NLL/mixed.json
            /training/language/conversation-v2/mixed-retention-study/DEV_BODY_NLL.json.gz
            /training/language/conversation-v2/public-dialogue-study/evaluation/initial.json
            /training/language/conversation-v2/paragraph-foundation/panels/B-579.json
            /training/language/model.py
            /training/language/round10/word_bpe.py
            /training/dialogue/tokenizer.py
      - name: Guard immutable launch and reconstruct public licensed source bundle
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test ! -f "$STUDY/UPDATES.jsonl"
          python - <<'PY'
          import pathlib,os,json,subprocess,hashlib,io,gzip,tarfile
          p=pathlib.Path(os.environ['STUDY']);go=json.loads((p/'GO.json').read_text());assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==go['expected_code_commit'];m=json.loads((p/'SOURCE_BUNDLE_MANIFEST.json').read_text());assert m['sha256']==go['bundle_SHA'];buf=io.BytesIO()
          for z in m['parts']:
            b=(p/'staging'/z['path']).read_bytes();assert len(b)==z['bytes']and hashlib.sha256(b).hexdigest()==z['sha256'];buf.write(b)
          assert len(buf.getvalue())==m['bytes']and hashlib.sha256(buf.getvalue()).hexdigest()==m['sha256']
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(buf.getvalue())))as t:
            for z in t:
              assert z.isfile() and pathlib.Path(z.name).name==z.name;data=t.extractfile(z).read();assert hashlib.sha256(data).hexdigest()==m['files'][z.name];assert not(p/z.name).exists();(p/z.name).write_bytes(data)
          (p/'RUN_LAUNCH.json').write_text(json.dumps(dict(run_id=os.environ['GITHUB_RUN_ID'],input_commit=os.environ['GITHUB_SHA'],optimizer_before_launch=0,model_forwards_before_launch=0,source_bundle_SHA=m['sha256'],automatic_replay=False),indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STUDY"
          git commit -m "Preserve fixed foundation absorption inputs before optimizer [skip ci]"
          git push origin HEAD:research/foundation-absorption-study
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical libraries only
        run: |
          python -m pip install --no-cache-dir torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir numpy==2.3.5
      - name: Verify all frozen original target positions and FAQ contract
        run: python -B "$STUDY/verify_inputs.py"
      - name: Run one-pass LM and both fresh-Adam FAQ SFT conditions
        run: python -B "$STUDY/engine.py"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: absorption-failure-receipts
          retention-days: 2
          path: |
            training/language/conversation-v2/foundation-absorption-study/FAILURE.json
            training/language/conversation-v2/foundation-absorption-study/UPDATES.jsonl
            training/language/conversation-v2/foundation-absorption-study/OPTIMIZER_CALLS.jsonl
            training/language/conversation-v2/foundation-absorption-study/FORWARDS.jsonl
