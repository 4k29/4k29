name: Prose learning rate evidence
on:
  push:
    branches: [research/prose-learning-rate]
    paths: [training/language/conversation-v2/prose-learning-rate/REPORT.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/family-diversity/C-0.json.gz
            /training/language/conversation-v2/replay-study/REPLAY.json
            /training/language/conversation-v2/replay-study/SCHEDULE.json
            /training/language/conversation-v2/replay-study/run.py
            /training/language/conversation-v2/oracle-memorization/evaluate.py
            /training/language/conversation-v2/gv-prose-pilot/EVALUATION_INPUTS.json
            /training/language/conversation-v2/broad-prose-replay/*.json
            /training/language/conversation-v2/broad-prose-replay/*.json.gz
            /training/language/conversation-v2/broad-prose-replay/run.py
            /training/language/conversation-v2/prose-learning-rate/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - working-directory: training/language/conversation-v2/prose-learning-rate
        run: |
          python verify.py
          python summarize.py
          git diff --exit-code -- METRICS.json JUDGMENTS.json TABLES.md
