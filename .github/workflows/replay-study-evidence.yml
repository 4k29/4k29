name: Replay study evidence verification
on:
  push:
    branches: [research/continuation-replay]
    paths: [training/language/conversation-v2/replay-study/REPORT.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/family-diversity/
            /training/language/conversation-v2/mixed-retention-study/corpus.json.gz
            /training/language/conversation-v2/mixed-retention-study/schedule.json.gz
            /training/language/conversation-v2/modern-corpus/STAIR_*.json
            /training/language/conversation-v2/replay-study/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - working-directory: training/language/conversation-v2/replay-study
        run: python verify.py
      - working-directory: training/language/conversation-v2/replay-study
        run: |
          python summarize.py
          git diff --exit-code -- METRICS.json JUDGMENTS.json COLLAPSE.json EXPOSURES.json TABLES.md
