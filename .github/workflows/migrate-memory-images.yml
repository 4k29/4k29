name: Migrate Memory images

on:
  push:
    paths:
      - ".github/memory-migration-trigger"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move and rename Memory images
        run: python scripts/migrate_memory_images.py

      - name: Remove one-time migration files
        run: |
          rm -f .github/memory-migration-trigger
          rm -f .github/workflows/migrate-memory-images.yml
          rm -f scripts/migrate_memory_images.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Memory image storage"
          git push
