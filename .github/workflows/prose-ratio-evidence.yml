name: Prose ratio evidence
on:
  push:
    branches: [research/prose-ratio]
    paths:
      - .github/workflows/prose-ratio-evidence.yml
      - training/language/conversation-v2/prose-ratio/REPORT.md
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /training/language/model.py
            /training/language/conversation-v2/eval_core.py
            /training/language/conversation-v2/data/tokenizer.json
            /training/language/conversation-v2/prose-depth/
            !/training/language/conversation-v2/prose-depth/artifacts/*/part-*.bin
            /training/language/conversation-v2/prose-development/
            !/training/language/conversation-v2/prose-development/artifacts/*/part-*.bin
            /training/language/conversation-v2/prose-ratio/
            !/training/language/conversation-v2/prose-ratio/artifacts/*/part-*.bin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - working-directory: training/language/conversation-v2/prose-ratio
        run: |
          python verify.py
          python summarize.py
          git diff --exit-code
