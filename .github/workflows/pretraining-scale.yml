name: Japanese pretraining corpus and evidence
on:
  pull_request:
    paths:
      - 'training/language/conversation-v2/pretraining-scale/**'
      - '.github/workflows/pretraining-scale.yml'
permissions:
  contents: read
jobs:
  pretraining-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            training/language/conversation-v2/pretraining-scale
            training/language/conversation-v2/foundation-data/corpus/documents.jsonl.gz
            training/language/conversation-v2/data/tokenizer.json
            training/language/conversation-v2/core.py
            training/language/model.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s training/language/conversation-v2/pretraining-scale -p test_corpus.py -v
