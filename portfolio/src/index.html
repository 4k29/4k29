<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b">
<meta name="description" content="しかのポートフォリオ。Web制作、写真、Tecircの記事。">
<title>Shika — Portfolio</title>
<link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip" href="#intro">Skip opening animation</a>
<main id="experience" hidden>
  <div id="stage" class="stage" tabindex="-1">
    <p id="scroll-hint" class="scroll-hint" aria-hidden="true">scroll <span>↓</span></p>
    <div class="workspace" id="workspace">
      <section id="intro" class="panel intro" aria-label="Shika ポートフォリオ" inert>
        <div class="intro-content">
          <h1 data-scramble>I'm うまいしか</h1>
          <p data-after-title>Design, photography & writing.</p>
        </div>
        <div class="panel-foot"><span></span><span class="down" aria-hidden="true">↓</span></div>
      </section>
      <section id="about" class="panel about" inert>
        <div class="about-content"></div>
      </section>
      <section id="project-panel" class="panel project" aria-label="Projects" inert></section>
      <section id="articles" class="gallery" aria-labelledby="article-heading" inert>
        <h2 id="article-heading">Tecirc</h2>
      </section>
      <section id="photos" class="gallery" aria-labelledby="photo-heading" inert>
        <h2 id="photo-heading">Photography</h2>
      </section>
      <section id="contact" class="panel contact" inert>
        <div class="contact-content"><h2 data-scramble>Find me here.</h2><div class="profile-links" data-after-title></div></div>
        <div class="panel-foot"><a href="#start" data-jump="start">Back to top</a></div>
      </section>
      <svg class="agent" id="agent" width="18" height="18" viewBox="0 0 44 44" aria-hidden="true"><path/><path/><path/></svg>
    </div>
  </div>
</main>
<noscript><p>Enable JavaScript to view this portfolio.</p></noscript>
<!-- portfolio-script -->
</body>
</html>
